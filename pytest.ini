[pytest]
asyncio_mode = auto
# Requires pytest-dotenv (dev dependency). Loads the repo-root .env before
# conftest imports, so a local `uv run pytest` picks up SYNAPSE_TEST_URL /
# SYNAPSE_DB_URL without exporting anything. Real env vars win over the file,
# which is what CI relies on; a missing .env is a no-op.
env_files = .env
testpaths = tests
addopts = -p no:logfire --strict-markers
# A hung test fails after two minutes instead of holding the CI job (and the deploy
# behind it) for the runner's six-hour default.
timeout = 120
markers =
    db: touches the shared Postgres test DB; applied automatically to tests that use a DB
        fixture, set by hand (pytestmark) in modules that connect directly; runs in the
        serial DB passes
