name: CI

on:
  # Branches are tested through their pull request; a push trigger on them as well
  # would run every commit twice.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  # No paths-ignore on pull_request: branch protection requires every job below,
  # and a workflow that never runs never reports them, so a docs-only PR could
  # only be force-merged. The push trigger keeps its filter (no image rebuild
  # for a README change).
  pull_request:

# A newer push to a PR cancels the superseded run. main is never cancelled: runs queue,
# so `latest` only ever moves forward.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false  # uv tool run doesn't use the project venv
      - name: Lint
        run: uv tool run ruff@0.15.15 check .
      - name: Format check
        run: uv tool run ruff@0.15.15 format --check .

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: "true"
      # mypy's incremental store: a warm cache re-checks only what changed.
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('uv.lock') }}-
      - name: Install dependencies
        run: uv sync --frozen
      # What gets checked is pyproject.toml's [tool.mypy] files list, which pre-commit
      # runs as well.
      - name: Mypy
        run: uv run mypy

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: "true"
          enable-cache: false  # installs bandit only, not the project venv
      - name: Install bandit
        run: uv pip install bandit
      - name: Bandit
        run: bandit -r ingestion/ mcp_server/ dream/ -ll -ii

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Unit tests for the pure helpers (node --test, no extra dependencies), then
      # tsc --noEmit + esbuild (web/package.json's "build"). A broken bundle fails
      # here and, via the push job's needs, can never ship in an image.
      - name: Install, test and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A ParadeDB service container gives each run its own Postgres. `services:` publish to
    # the job's localhost, so it's reachable at 127.0.0.1:5432. A per-run ephemeral database
    # still gives isolation; the whole service is torn down with the job.
    services:
      paradedb:
        # The same image, by digest, as compose.yml's postgres (tests/test_ci_config.py
        # keeps them equal), so a green run says something about production's PostgreSQL
        # and pg_search. `env` is not available in a service's image, hence the copy.
        image: paradedb/paradedb:latest-pg17@sha256:0defbfb50d530e6e875ab584528f1e235662225127c09e7a8d5651e59dabe341
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synapse -d synapse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      PGHOST: localhost
      PGUSER: synapse
      PGPASSWORD: synapse
      CI_DB: ci_${{ github.run_id }}_${{ github.run_attempt }}
      # The pooled DB pass runs beside the plain one, on its own copy of the database.
      CI_DB_POOL: ci_${{ github.run_id }}_${{ github.run_attempt }}_pool
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: "true"
      - name: Install psql client
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      # Schema comes from scripts/apply_schema.sh — the same script the shipped
      # first-boot init hook runs — so the tested list and the shipped list
      # can't drift.
      - name: Provision ephemeral test DB on the ParadeDB service container + apply schema
        run: |
          uv sync --frozen &
          UV_PID=$!
          psql -h "$PGHOST" -U "$PGUSER" -d postgres -c "DROP DATABASE IF EXISTS \"$CI_DB\" WITH (FORCE)"
          psql -h "$PGHOST" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$CI_DB\""
          scripts/apply_schema.sh "postgresql://$PGUSER:$PGPASSWORD@$PGHOST:5432/$CI_DB"
          # Every migration must also survive a re-run: upgrades and `make schema` rely on it.
          scripts/apply_schema.sh --all "postgresql://$PGUSER:$PGPASSWORD@$PGHOST:5432/$CI_DB"
          psql -h "$PGHOST" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$CI_DB_POOL\" TEMPLATE \"$CI_DB\""
          wait $UV_PID
      - name: Run tests (parallel non-DB, then the DB passes side by side)
        env:
          SYNAPSE_TEST_URL: postgresql://synapse:synapse@localhost:5432/ci_${{ github.run_id }}_${{ github.run_attempt }}
          SYNAPSE_DB_URL: postgresql://synapse:synapse@localhost:5432/ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          # Tests that touch no database fan out across all cores
          uv run pytest tests/ -n auto --dist loadfile --maxfail=5 -m "not db"
          # DB tests are serial within a pass (TRUNCATE/INSERT would race across workers),
          # but the two passes use separate databases and run at the same time: the plain
          # one, and one through a session-wide connection pool, the way the server runs
          # (ingestion/pg_pool).
          uv run pytest tests/ -p no:xdist --maxfail=5 -m db > db.log 2>&1 &
          PLAIN=$!
          POOL_URL="postgresql://synapse:synapse@localhost:5432/$CI_DB_POOL"
          SYNAPSE_TEST_POOL=1 SYNAPSE_TEST_URL="$POOL_URL" SYNAPSE_DB_URL="$POOL_URL" \
            uv run pytest tests/ -p no:xdist --maxfail=5 -m db > db-pool.log 2>&1 &
          POOLED=$!
          FAILED=0
          wait $PLAIN || FAILED=1
          wait $POOLED || FAILED=1
          echo "::group::DB tests"; cat db.log; echo "::endgroup::"
          echo "::group::DB tests, pooled"; cat db-pool.log; echo "::endgroup::"
          exit $FAILED
      - name: Drop ephemeral test DB
        if: always()
        run: |
          for db in "$CI_DB" "$CI_DB_POOL"; do
            psql -h "$PGHOST" -U "$PGUSER" -d postgres -c "DROP DATABASE IF EXISTS \"$db\" WITH (FORCE)" || true
          done

  # The image builds on every run, in parallel with the quality gates (no `needs`), so a
  # broken Dockerfile, lockfile or web bundle fails the PR instead of the merge. On main it
  # also pushes :<sha>; the push job below only moves `latest` onto it once every gate is
  # green, which is a manifest copy rather than a second build.
  #
  # The image builds self-contained (the Dockerfile needs no external base), with a
  # GHA layer cache so warm builds reuse the apt/uv/CLI layers. Fresh clones build
  # the same way with `docker compose up -d --build`.
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Forks have no GHCR push rights under this owner; PRs never publish.
      PUBLISH: ${{ github.repository == 'kraft87/synapse' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build synapse
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=synapse
          cache-to: type=gha,mode=max,scope=synapse
          provenance: false

  push:
    name: Publish latest
    # Deployment is pull-based: hosts running this stack watch ghcr.io/<repo>:latest and
    # update themselves (e.g. Watchtower), so CI never reaches into any host. `latest`
    # moves only when every check is green.
    needs: [ruff, mypy, bandit, web, test, build]
    # Repository guard: forks have no GHCR push rights under this owner.
    if: github.repository == 'kraft87/synapse' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at this commit's image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
