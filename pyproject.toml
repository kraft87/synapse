[project]
name = "synapse"
version = "1.0.1"
description = "Self-hosted long-term memory for AI coding agents — episodic store, knowledge graph, and MCP server"
license = { text = "MIT" }
authors = [{ name = "kraft87" }]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "logfire[httpx]>=3.0",
    "orjson>=3.10",
    "voyageai>=0.3",
    "claude-agent-sdk>=0.1.72",
    "tenacity>=8.0",
    "numpy>=1.26",
    "fastmcp>=3.4",
    "pydantic-ai-slim[openai]>=2.13.0",
    # Postgres-backed OAuth-proxy state store (asyncpg). fastmcp already pulls
    # py-key-value-aio; we add the postgresql extra so the OAuth state survives
    # container recreates in Postgres instead of the ephemeral disk default.
    "py-key-value-aio[postgresql]>=0.4.5",
]

[project.scripts]
# On PATH inside the image (/app/.venv/bin), which is what makes the first-device
# bootstrap one command: `docker compose exec mcp-server synapse-admin bootstrap "<label>"`.
synapse-admin = "ingestion.surface_admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "mcp_server", "dream"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest-timeout>=2.3",
]

# NOTE: pytest config lives in pytest.ini, which takes precedence over
# [tool.pytest.ini_options] whenever it exists. A block here would be silently
# ignored — edit pytest.ini instead.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["synapse"]

[tool.ruff.lint.per-file-ignores]
# Bundled host-side operational scripts (the Claude Code plugin) favor terse one-liners.
"plugin/scripts/*" = ["E702"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# The one list of what is type-checked: CI and pre-commit both run a bare `uv run mypy`.
# `exclude` only prunes directory walks, so the mcp_server modules named here (the recall
# engine, its KG leg, the board, the auth routes and the dashboard) are still checked; the other mcp_server
# modules are followed as imports, not reported. Add one when it is clean under strict.
files = [
    "ingestion",
    "dream",
    "mcp_server/__init__.py",
    "mcp_server/recall*.py",
    "mcp_server/kg_pg.py",
    "mcp_server/board.py",
    "mcp_server/server_auth.py",
    "mcp_server/http_auth.py",
    "mcp_server/auth_tokens.py",
    "mcp_server/caller_trust.py",
    "mcp_server/idp.py",
    "mcp_server/device_routes.py",
    "mcp_server/web_login_routes.py",
    "mcp_server/dash/*.py",
]
exclude = ["tests/", "mcp_server/", "plugin/"]
